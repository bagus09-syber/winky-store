<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WINKY STORE - Offline</title>
    <meta name="description" content="Anda sedang dalam mode offline">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00e5ff">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-deep); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .offline-container { 
            text-align: center; 
            padding: 48px 24px; 
        }
        .offline-icon { 
            width: 80px; height: 80px; 
            border: 4px solid var(--cyan); 
            border-radius: 24px; 
            display: flex; align-items: center; justify-content: center; 
            margin: 0 auto 24px; 
            background: var(--bg-card); 
        }
        .offline-icon svg { width: 40px; height: 40px; fill: var(--cyan); }
        .offline-title { 
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 24px; font-weight: 700; color: var(--cyan); 
            margin-bottom: 12px; 
        }
        .offline-desc { 
            color: var(--text-secondary); 
            font-size: 14px; 
            margin-bottom: 24px; 
            max-width: 400px; 
            margin-left: auto; margin-right: auto; 
        }
        .offline-actions { 
            display: flex; justify-content: center; gap: 16px; 
        }
        .btn-glow { 
            display: inline-flex; align-items: center; gap: 8px; 
            padding: 12px 24px; border-radius: 14px; 
            font-weight: 700; font-size: 14px; 
            background: linear-gradient(135deg, var(--cyan), var(--blue)); 
            color: #000; border: none; cursor: pointer; 
            text-decoration: none; transition: all .3s ease; 
        }
        .btn-glow:hover { 
            transform: translateY(-2px) scale(1.02); 
            box-shadow: 0 8px 32px rgba(0,229,255,0.45); 
        }
        .try-again { color: var(--text-secondary); font-size: 12px; margin-top: 16px; display: block; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>
        <h1 class="offline-title">Anda Offline</h1>
        <p class="offline-desc">Koneksi internet terputus. Silakan cek koneksi dan coba lagi.</p>
        <div class="offline-actions">
            <a href="/" class="btn-glow">Kembali ke Beranda</a>
            <p class="try-again">Coba kembali</p>
        </div>
    </div>

    <script>
        // Check if coming back online
        window.addEventListener('online', () => {
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });
    </script>
</body>
</html>
