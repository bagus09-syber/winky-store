version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: winky-store-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: mysql:8.0
    container_name: winky-store-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-winky_store}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: winky-store-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["--save", "60", "1", "--requirepass", "strongredispassword123"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-strongredispassword123}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: winky-store-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  queueworker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: winky-store-queue
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    env_file:
      - .env
    command: ["php", "artisan", "queue:work", "--redis", "--tries=3", "--sleep=3"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: winky-store-scheduler
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    env_file:
      - .env
    command: ["php", "artisan", "schedule:run", "--frequency=minutely"]

  mailhog:
    image: mailhog/mailhog
    container_name: winky-store-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MAILHOG_SMTP_BIND_ADDRESS=0.0.0.0
      - MAILHOG_SMP_PORT=1025

volumes:
  db_data:
  redis_data: