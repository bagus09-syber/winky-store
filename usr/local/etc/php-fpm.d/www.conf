[www]

; Production PHP-FPM tuning
listen = 9000
listen.owner = appuser
listen.group = appgroup
listen.mode = 0660

user = appuser
group = appgroup

; Process management
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35

; Request handling
request_terminate_timeout = 0
request_timeout = 0

; Logging
php_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/log

; Security
php_admin_value[open_basedir] = /var/www/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

; Performance
php[opcache.enable] = 1
php[opcache.enable_cli] = 0
php[opcache.memory_consumption] = 128
php[opcache.interned_strings_buffer] = 8
php[opcache.max_accelerated_files] = 4000
php[opcache.revalidate_freq] = 2
php[opcache.fast_shutdown] = 1